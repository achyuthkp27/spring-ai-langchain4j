# aegis-merged: Spring AI chassis + LC4j security/streaming improvements.
# Port 8082 — 8080 = original aegis-ai, 8081 = aegis-lc4j.
server:
  port: 8082
  # Phase 4 (resilience): let in-flight requests (esp. a streaming SSE turn) finish instead
  # of being cut off mid-response on deploy/restart.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  application:
    name: aegis-merged

  # Share the already-running aegis-lc4j Postgres (pgvector) instead of letting
  # spring-boot-docker-compose spin up a second container on the same port.
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis
    username: aegis
    password: aegis

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    # Provider selection — the extension point for the Phase 2+ model router.
    # Only the selected provider's beans are created; the rest stay dormant.
    model:
      chat: ollama
      embedding: ollama        # Phase 1 (RAG) — local embeddings, zero egress
      image: none
      moderation: none         # enabled in Phase 4 (guardrails)
      audio:
        transcription: none    # Phase 6 stretch: voice notes on disputes
        speech: none

    # Resilience: retry transient model errors with backoff (spring-ai-retry).
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 800ms
        multiplier: 2
      on-client-errors: false

    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never   # run `ollama pull qwen2.5:7b && ollama pull nomic-embed-text && ollama pull all-minilm`
        # nomic-embed-text = RAG retrieval; all-minilm = semantic-cache query similarity (see CacheConfig)
      chat:
        options:
          # qwen3.5:4b thinking model; aegis.llm.think=false keeps tool-calling
          # latency sane (reasoning would run before every tool step).
          model: qwen3.5:4b
          temperature: 0.2
          num-predict: 512      # ample for concise answers; caps runaway generation
      embedding:
        options:
          model: nomic-embed-text   # 768-dim local embedding model

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768             # must match nomic-embed-text
        index-type: hnsw
        distance-type: cosine_distance

    mcp:
      server:
        name: aegis-mcp
        version: 0.1.0
        type: SYNC
        # SSE transport; base message endpoint under /mcp
        sse-message-endpoint: /mcp/message

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

aegis:
  llm:
    think: false   # Ollama ThinkOption — disable qwen3.5 reasoning mode
  router:
    enabled: true
    escalation:
      provider: ollama       # or anthropic (needs ANTHROPIC_API_KEY)
      model: qwen3.5:9b      # or claude-sonnet-4-5 when provider=anthropic
  redis:
    # Externalizes RateLimiter/BudgetGuard so they hold under horizontal scaling (see
    # config.RedisConfig). Off by default — single-instance deploys don't need it.
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Phase 4 (resilience): k8s-style split health checks — readiness (safe to route traffic
  # to) vs liveness (safe to keep running) are different questions; a DB hiccup should fail
  # readiness without triggering a container restart that wouldn't fix it.
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: aegis-merged

logging:
  level:
    # SimpleLoggerAdvisor logs full prompts/completions at DEBUG — dev only,
    # this is a data-leak vector in production (see design doc, Observability)
    org.springframework.ai.chat.client.advisor: DEBUG

---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2

---
spring:
  config:
    activate:
      on-profile: anthropic
  ai:
    model:
      chat: anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-5
          temperature: 0.2

---
# Swaps embeddings (RAG retrieval + semantic cache) to OpenAI. Required for any
# cloud deploy — Ollama isn't available there. Compose with a chat profile:
#   --spring.profiles.active=openai,openai-embeddings    (all-OpenAI, one API key)
#   --spring.profiles.active=anthropic,openai-embeddings (Claude chat + OpenAI embeddings,
#                                                          since Anthropic has no embedding API)
# text-embedding-3-small is 1536-dim, vs nomic-embed-text's 768 — the vector store
# dimension MUST match whatever produced the vectors, so pgvector needs a fresh
# schema/re-ingest when switching (initialize-schema handles a clean database;
# switching an EXISTING populated store requires dropping vector_store first).
spring:
  config:
    activate:
      on-profile: openai-embeddings
  ai:
    model:
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        dimensions: 1536

---
# Phase 4 (resilience) + Phase 2 (secrets): activate alongside a real chat/embedding profile,
# e.g. --spring.profiles.active=anthropic,openai-embeddings,prod. Structured JSON logs are what
# a real log pipeline (Datadog/Grafana Loki/ELK) actually wants — human-readable console output
# is a dev-only convenience this profile deliberately gives up. JwtService also refuses to
# start under this profile with the default JWT secret (see that class) rather than just
# warning, since "prod" is the one place that gap can't ship silently.
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
