services:
  # Only started when aegis.redis.enabled=true (see config.RedisConfig). NOT auto-started
  # by spring-boot-docker-compose — spring.docker.compose.enabled=false, same as postgres
  # below, since this app shares aegis-lc4j's already-running Postgres. Start manually:
  #   docker compose up -d redis
  redis:
    image: redis:7-alpine
    # Was unauthenticated (CODE_REVIEW.md P4 #12) — anyone who could reach the port could read
    # rate-limit/budget state or flush it. Password is env-overridable so a real deployment
    # doesn't have to use the dev default; RateLimiter/BudgetGuard would need
    # spring.data.redis.password set to match when aegis.redis.enabled=true.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-aegis-dev-only}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aegis-dev-only}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  postgres:
    # pgvector image = Postgres 16 + the `vector` extension (superset of plain PG).
    # Serves both conversation memory (JDBC) and RAG embeddings (Phase 1).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegis
      # Plaintext "aegis" was hardcoded with no way to override it (CODE_REVIEW.md P4 #12) —
      # env-var substitution keeps the same local-dev default while letting a real deployment
      # set POSTGRES_PASSWORD without editing this file (or committing a real secret to it).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis-dev-only}
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      # No volume existed at all — Postgres data (including the audit table's hash-chained
      # history) was lost the moment the container was removed, not just stopped
      # (CODE_REVIEW.md P4 #12).
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

volumes:
  postgres-data:
  redis-data:
