# aegis-merged: Spring AI chassis + LC4j security/streaming improvements.
server:
  port: 8082
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  application:
    name: aegis-merged

  mvc:
    async:
      request-timeout: 60000

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis
    username: aegis
    password: aegis-dev-only

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:aegis-dev-only}

  ai:
    model:
      chat: ollama
      embedding: ollama
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

    retry:
      max-attempts: 1
      on-client-errors: false

    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        options:
          # qwen3.5:4b thinking model; aegis.llm.think=false keeps tool-calling
          model: qwen3.5:4b
          temperature: 0.2
          num-predict: 1024
          num-ctx: 16384
      embedding:
        options:
          model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance

    mcp:
      server:
        name: aegis-mcp
        version: 0.1.0
        type: SYNC
        sse-message-endpoint: /mcp/message

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

aegis:
  llm:
    think: false
  router:
    enabled: true
    escalation:
      provider: ollama
      model: qwen3.5:9b
  redis:
    enabled: false
  known-tenants: achu-bank,globex-bank
  ratelimit:
    user-capacity: 20
    user-refill-per-sec: 1.0
    tenant-capacity: 200
    tenant-refill-per-sec: 10.0
  budget:
    default-daily-tokens: 100000
  cache:
    similarity-threshold: 0.62
  llmguard:
    call-timeout: 30s
    first-token-timeout: 15s
    inter-token-timeout: 30s
  audit:
    hmac-secret: ${AEGIS_AUDIT_HMAC_SECRET:}
  aml:
    large-transaction-threshold: 5000
    velocity-threshold: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: aegis-merged

logging:
  level:
    org.springframework.ai.chat.client.advisor: INFO

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2

---
spring:
  config:
    activate:
      on-profile: anthropic
  ai:
    model:
      chat: anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-5
          temperature: 0.2

---
spring:
  config:
    activate:
      on-profile: openai-embeddings
  ai:
    model:
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        dimensions: 1536

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
logging:
  structured:
    format:
      console: ecs
