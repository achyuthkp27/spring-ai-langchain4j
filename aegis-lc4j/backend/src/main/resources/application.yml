# 8081: the original aegis-ai app commonly occupies 8080 on this machine.
server:
  port: 8081

spring:
  application:
    name: aegis-lc4j
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis
    username: aegis
    password: aegis
  sql:
    init:
      mode: always

aegis:
  ollama:
    base-url: http://localhost:11434
    chat-model: qwen3.5:4b
    embedding-model: nomic-embed-text
    cache-embedding-model: all-minilm
    temperature: 0.2
    num-predict: 512
    think: false
  jwt:
    secret: change-me-in-prod-this-is-a-dev-only-256bit-secret!!
    ttl-seconds: 3600
  budget:
    daily-tokens-per-tenant: 100000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    com.aegis.lc4j: INFO
