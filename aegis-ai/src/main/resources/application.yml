spring:
  application:
    name: aegis-ai

  ai:
    model:
      chat: ollama
      embedding: ollama
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

    # Resilience: retry transient model errors with backoff (spring-ai-retry).
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 800ms
        multiplier: 2
      on-client-errors: false

    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        options:
          # Qwen2.5-7B-Instruct: strong tool-calling + grounding (fixes the
          model: qwen2.5:7b
          temperature: 0.2
          num-predict: 512
      embedding:
        options:
          model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance

    mcp:
      server:
        name: aegis-mcp
        version: 0.1.0
        type: SYNC
        sse-message-endpoint: /mcp/message

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: aegis-ai

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2

---
spring:
  config:
    activate:
      on-profile: anthropic
  ai:
    model:
      chat: anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-5
          temperature: 0.2

---
spring:
  config:
    activate:
      on-profile: openai-embeddings
  ai:
    model:
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        dimensions: 1536
